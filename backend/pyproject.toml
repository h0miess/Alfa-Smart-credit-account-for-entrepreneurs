[project]
name = "credit-cabinet"
version = "0.1.0"
description = "Бэкенд умного кредитного кабинета предпринимателя: заявки, статусы, SSO"
authors = [
    { name = "Ivan Kurbatov", email = "ivankurbatov124@mail.ru" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pydantic-settings>=2.6,<3",
    "pyjwt[crypto]>=2.10,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn[standard]>=0.30,<1",
]

[tool.uv]

package = false
