[project]
name = "credit-cabinet"
version = "0.1.0"
description = "Бэкенд умного кредитного кабинета предпринимателя: заявки, статусы, SSO"
authors = [
    { name = "Ivan Kurbatov", email = "ivankurbatov124@mail.ru" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "jinja2>=3.1,<4",
    "pydantic-settings>=2.6,<3",
    "pyjwt[crypto]>=2.10,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "taskiq>=0.13,<1",
    "taskiq-fastapi>=0.5,<1",
    "taskiq-redis>=1.2,<2",
    "tenacity>=9.1,<10",
    "uvicorn[standard]>=0.30,<1",
]

[tool.uv]

package = false

[dependency-groups]
dev = [
    "mypy>=2.4,<3",
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "respx>=0.23,<1",
    "ruff>=0.17,<1",
    "testcontainers[postgres,redis]>=4.15,<5",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC"]
ignore = ["E501", "B904"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Security", "fastapi.File", "fastapi.Form", "taskiq.TaskiqDepends"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: нужен Docker (testcontainers)",
    "contract: нужен запущенный ml (ML_URL)",
    "e2e: нужен поднятый compose",
]
