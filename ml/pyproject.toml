[project]
name = "credit-scoring"
version = "0.1.0"
description = "PD-скоринг и кредитное решение для МСБ (синтетические данные)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "scikit-learn>=1.5,<1.8",
    "lightgbm>=4.5,<5",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.8,<3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credit_scoring"]

[tool.pytest.ini_options]
testpaths = ["tests"]
